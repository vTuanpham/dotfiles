<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="346" viewBox="0 0 1040 346" role="img" aria-labelledby="title desc">
  <title id="title">How configuration reaches your home directory</title>
  <desc id="desc">Live links share the repository file. Snapshots copy only into a missing destination. Hooks and plugin entries merge on request, leaving a backup. Credentials, trust, approvals and history stay outside Git.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1040" height="346" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="37" font-size="11" letter-spacing="2.4" fill="#68766f">CONFIGURATION</text>
    <text x="36" y="75" font-family="Georgia, serif" font-size="30">How files reach your home</text>
    <text x="36" y="189" font-family="monospace" font-size="23">dotfiles/</text>
    <text x="36" y="214" font-size="13" fill="#68766f">The working tree</text>
    <path d="M190 177H222V124H409" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M190 193H409" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M190 209H222V266H409" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="258" y="113" font-size="13" fill="#68766f">same file</text>
    <text x="258" y="182" font-size="13" fill="#68766f">copy if missing</text>
    <text x="258" y="255" font-size="13" fill="#68766f">merge on request</text>
    <text x="437" y="130" font-size="19" font-weight="700" fill="#23786f">Live links</text>
    <text x="616" y="130" font-size="14" fill="#68766f">Shell, prompt, instructions, skills, Wake</text>
    <path d="M437 151H1004" stroke="#d3d8d1"/>
    <text x="437" y="201" font-size="19" font-weight="700" fill="#506b90">Snapshots</text>
    <text x="616" y="201" font-size="14" fill="#68766f">Editor and tool preferences</text>
    <path d="M437 223H1004" stroke="#d3d8d1"/>
    <text x="437" y="272" font-size="19" font-weight="700" fill="#8d6a42">Hooks &amp; plugins</text>
    <text x="616" y="272" font-size="14" fill="#68766f">Added to live settings; a backup is left</text>
    <text x="36" y="322" font-size="12" fill="#68766f">Outside Git: credentials, trust, approvals, history and generated catalogs.</text>
  </g>
</svg>
