<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
  <title id="title">Tools around an agent session</title>
  <desc id="desc">Inbox carries chat, commands and images between the human and existing sessions. Baton carries questions and secret handoffs. Native delegation stays within a harness; Bridge runs workers in other harnesses. Model Guide, account observations, resource admission and persistent labs support the work.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker></defs>
  <rect width="1040" height="410" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">AGENT TOOLS</text>
    <text x="36" y="78" font-family="Georgia, serif" font-size="30">One session. Connected tools.</text>
    <text x="36" y="177" font-size="23" font-weight="700">You</text>
    <text x="36" y="203" font-size="14" fill="#68766f">PC or phone</text>
    <text x="436" y="177" font-size="23" font-weight="700">Root session</text>
    <text x="436" y="203" font-size="14" fill="#68766f">Any supported harness</text>
    <text x="859" y="177" font-size="23" font-weight="700">Workers</text>
    <text x="859" y="203" font-size="14" fill="#68766f">Native or cross-harness</text>
    <path d="M151 148H397" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="274" y="131" text-anchor="middle" font-size="18" fill="#23786f">Inbox</text>
    <text x="274" y="172" text-anchor="middle" font-size="12" fill="#68766f">chat · commands · images</text>
    <path d="M151 224H397" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="274" y="210" text-anchor="middle" font-size="18" fill="#a35e43">Baton</text>
    <text x="274" y="248" text-anchor="middle" font-size="12" fill="#68766f">questions · private handoffs</text>
    <path d="M615 167H819" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="717" y="145" text-anchor="middle" font-size="18" fill="#506b90">Native / Bridge</text>
    <text x="717" y="194" text-anchor="middle" font-size="12" fill="#68766f">same / other harness</text>
    <path d="M36 282H1004" stroke="#d3d8d1"/>
    <circle cx="41" cy="317" r="4" fill="#23786f"/>
    <text x="55" y="323" font-size="18" font-weight="700">Model Guide</text>
    <text x="36" y="348" font-size="13" fill="#68766f">Model + effort evidence</text>
    <circle cx="291" cy="317" r="4" fill="#a35e43"/>
    <text x="305" y="323" font-size="18" font-weight="700">Accounts</text>
    <text x="286" y="348" font-size="13" fill="#68766f">Source + freshness</text>
    <circle cx="541" cy="317" r="4" fill="#506b90"/>
    <text x="555" y="323" font-size="18" font-weight="700">Resources</text>
    <text x="536" y="348" font-size="13" fill="#68766f">Shared heavy-work queue</text>
    <circle cx="791" cy="317" r="4" fill="#65598a"/>
    <text x="805" y="323" font-size="18" font-weight="700">Lab</text>
    <text x="786" y="348" font-size="13" fill="#68766f">Persistent experiments</text>
    <text x="36" y="387" font-size="12" fill="#68766f">Shared instructions and scoped skills connect the workflows; each tool owns its lifecycle.</text>
  </g>
</svg>
