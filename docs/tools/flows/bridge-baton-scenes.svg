<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="646" viewBox="0 0 1040 646" role="img" aria-labelledby="title desc">
  <title id="title">Human handoffs across sessions</title>
  <desc id="desc">A root asks the human through its native harness, then sends one Baton reminder after about three minutes if active and still unanswered. Concurrent requests have separate notifications and reply links. Secret forms hand values to an approved app or command without exposing them to the agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1040" height="646" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="37" font-size="11" letter-spacing="2.4" fill="#68766f">BRIDGE + BATON</text>
    <text x="36" y="75" font-family="Georgia, serif" font-size="30">Human handoffs across sessions</text>
    <text x="36" y="127" font-size="13" fill="#a35e43">01</text>
    <text x="80" y="128" font-size="20" font-weight="700">A worker needs a decision</text>
    <text x="80" y="181" font-size="17">Worker</text>
    <text x="250" y="181" font-size="17">Root</text>
    <text x="404" y="181" font-size="17">Native question</text>
    <text x="700" y="181" font-size="17" fill="#a35e43">Baton</text>
    <text x="913" y="181" font-size="17">You</text>
    <path d="M153 176H227" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M296 176H380" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M763 176H888" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M546 176H675" fill="none" stroke="#737f7c" stroke-width="1.4" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
    <text x="610" y="158" text-anchor="middle" font-size="11" fill="#68766f">still pending ~3 min</text>
    <text x="610" y="199" text-anchor="middle" font-size="11" fill="#68766f">while root is active</text>
    <path d="M929 197V225H273V196" fill="none" stroke="#a4ada7" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="80" y="253" font-size="13" fill="#68766f">The root takes the reply back to the right job. Independent workers keep running.</text>
    <path d="M36 278H1004" stroke="#d3d8d1"/>
    <text x="36" y="313" font-size="13" fill="#23786f">02</text>
    <text x="80" y="314" font-size="20" font-weight="700">Two sessions ask at once</text>
    <text x="80" y="362" font-size="17" fill="#8d6a42">Session A</text>
    <text x="299" y="362" font-size="15">Notification A</text>
    <text x="562" y="362" font-size="15">Form A</text>
    <text x="813" y="362" font-size="15" fill="#8d6a42">Still pending</text>
    <path d="M185 357H270" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M415 357H532" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M632 357H783" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="80" y="406" font-size="17" fill="#23786f">Session B</text>
    <text x="299" y="406" font-size="15">Notification B</text>
    <text x="562" y="406" font-size="15">Form B</text>
    <text x="813" y="406" font-size="15" fill="#23786f">Reply to B</text>
    <path d="M185 401H270" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M415 401H532" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M632 401H783" fill="none" stroke="#a4ada7" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="80" y="441" font-size="13" fill="#68766f">One phone, separate notification tags and one-use reply links.</text>
    <path d="M36 467H1004" stroke="#d3d8d1"/>
    <text x="36" y="502" font-size="13" fill="#65598a">03</text>
    <text x="80" y="503" font-size="20" font-weight="700">A secret is needed</text>
    <text x="80" y="547" font-family="monospace" font-size="16" fill="#65598a">ask + type</text>
    <text x="80" y="573" font-size="14">Human form → daemon memory → approved app</text>
    <text x="80" y="597" font-size="12" fill="#68766f">The agent requests a field by name, never its value.</text>
    <text x="590" y="547" font-family="monospace" font-size="16" fill="#506b90">run</text>
    <text x="590" y="573" font-size="14">Human reviews command → private terminal</text>
    <text x="590" y="597" font-size="12" fill="#68766f">The password goes to the command's own prompt.</text>
  </g>
</svg>
