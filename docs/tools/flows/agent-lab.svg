<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">A persistent experiment, from creation to cleanup</title>
  <desc id="desc">Create a lab, work in it, keep it protected or retire it. Restore returns the same files to active use. Only expired retired labs that pass cleanup checks can be deleted. Work, artifacts and scratch persist outside the project, with inferred provenance.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker></defs>
  <rect width="1040" height="470" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">AGENT LAB</text>
    <text x="36" y="78" font-family="Georgia, serif" font-size="30">Experiments that survive the session.</text>
    <text x="36" y="190" font-size="20" font-weight="700">new</text>
    <path d="M100 184H210" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="230" y="150" width="180" height="70" rx="13" fill="#eaf0eb"/>
    <text x="320" y="179" text-anchor="middle" font-size="22" font-weight="700">Active</text>
    <text x="320" y="203" text-anchor="middle" font-size="13" fill="#56675d">work · run · inspect</text>
    <rect x="600" y="150" width="180" height="70" rx="13" fill="#ece9f3"/>
    <text x="690" y="179" text-anchor="middle" font-size="22" font-weight="700">Kept</text>
    <text x="690" y="203" text-anchor="middle" font-size="13" fill="#65598a">protected indefinitely</text>
    <path d="M410 184H580" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="495" y="168" text-anchor="middle" font-size="13" fill="#68766f">keep</text>
    <path d="M690 220V257H370V232" fill="none" stroke="#a4ada7" stroke-width="1.3" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
    <text x="529" y="248" text-anchor="middle" font-size="13" fill="#68766f">restore</text>
    <path d="M320 220V300" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="330" y="278" font-size="13" fill="#68766f">retire</text>
    <rect x="230" y="320" width="180" height="70" rx="13" fill="#f3ebe3"/>
    <text x="320" y="350" text-anchor="middle" font-size="22" font-weight="700">Retired</text>
    <text x="320" y="374" text-anchor="middle" font-size="13" fill="#8d6a42">14-day grace by default</text>
    <path d="M230 355H142V220H217" fill="none" stroke="#a4ada7" stroke-width="1.3" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
    <text x="100" y="283" font-size="13" fill="#68766f">restore</text>
    <path d="M410 355H490" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="450" y="309" text-anchor="middle" font-size="12" fill="#68766f">grace expired</text>
    <rect x="510" y="320" width="240" height="70" rx="13" fill="#eef0f2"/>
    <text x="630" y="349" text-anchor="middle" font-size="20" font-weight="700">GC preview + checks</text>
    <text x="630" y="374" text-anchor="middle" font-size="12" fill="#68766f">leases · mounts · metadata · .git</text>
    <path d="M750 355H850" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="799" y="337" text-anchor="middle" font-size="12" fill="#68766f">--apply</text>
    <text x="872" y="362" font-size="20" font-weight="700">Removed</text>
    <path d="M36 419H1004" stroke="#d3d8d1"/>
    <text x="36" y="448" font-size="13" fill="#68766f">work/ · artifacts/ · tmp/</text>
    <text x="404" y="448" font-size="13" fill="#68766f">Purpose + detected harness, session, model and effort stay with the lab.</text>
  </g>
</svg>
