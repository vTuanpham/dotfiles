<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Routes into the Windows ChatGPT app's browser runtime</title>
  <desc id="desc">Codex in WSL starts chatgpt-browser mcp, which launches the app's Windows browser runtime. Linux Chrome starts chatgpt-browser as its native-messaging host, which checks the extension origin and launches the app's native host. Windows Chrome reaches the same native host directly. The Windows app owns the runtime and native host.</desc>
  <rect width="960" height="440" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="40" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">CHATGPT BROWSER FROM WSL</text>
    <text x="40" y="72" font-family="Georgia, serif" font-size="26">Routes into the Windows app's browser runtime</text>

    <rect x="24" y="96" width="456" height="290" rx="14" fill="#f2f0ea" stroke="#dcd8cd"/>
    <text x="44" y="122" font-size="11" font-weight="700" letter-spacing="1.6" fill="#68766f">WSL</text>
    <rect x="504" y="96" width="432" height="290" rx="14" fill="#f2f0ea" stroke="#dcd8cd"/>
    <text x="524" y="122" font-size="11" font-weight="700" letter-spacing="1.6" fill="#68766f">WINDOWS</text>

    <!-- Row 1: Codex -->
    <rect x="44" y="140" width="116" height="62" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="102" y="168" font-size="15" font-weight="700" text-anchor="middle">Codex</text>
    <text x="102" y="187" font-size="12" fill="#68766f" text-anchor="middle">in WSL</text>
    <path d="M164 171H198" stroke="#737f7c" stroke-width="1.5"/><path d="M198 166.5L206 171L198 175.5Z" fill="#737f7c"/>
    <rect x="208" y="140" width="252" height="62" rx="10" fill="#ffffff" stroke="#a35e43" stroke-width="1.5"/>
    <text x="224" y="164" font-size="14" font-weight="700" fill="#a35e43">chatgpt-browser mcp</text>
    <text x="224" y="182" font-size="12" fill="#68766f">forwards stdio; keeps the sandbox unless</text>
    <text x="224" y="196" font-size="12" fill="#68766f">--disable-sandbox is passed</text>
    <path d="M460 171H536" stroke="#737f7c" stroke-width="1.5"/><path d="M536 166.5L544 171L536 175.5Z" fill="#737f7c"/>
    <text x="500" y="162" font-size="11.5" fill="#68766f" text-anchor="middle">launches</text>
    <rect x="546" y="140" width="368" height="62" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="562" y="164" font-size="15" font-weight="700">Browser runtime</text>
    <text x="562" y="183" font-size="12" fill="#68766f">installed by the ChatGPT app; its paths are read</text>
    <text x="562" y="197" font-size="12" fill="#68766f">from the app and checked to agree</text>

    <!-- Row 2: Linux Chrome -->
    <rect x="44" y="236" width="150" height="62" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="119" y="264" font-size="15" font-weight="700" text-anchor="middle">Linux Chrome</text>
    <text x="119" y="283" font-size="12" fill="#68766f" text-anchor="middle">with the extension</text>
    <path d="M198 267H224" stroke="#737f7c" stroke-width="1.5"/><path d="M224 262.5L232 267L224 271.5Z" fill="#737f7c"/>
    <rect x="234" y="236" width="226" height="62" rx="10" fill="#ffffff" stroke="#a35e43" stroke-width="1.5"/>
    <text x="250" y="260" font-size="14" font-weight="700" fill="#a35e43">chatgpt-browser</text>
    <text x="250" y="278" font-size="12" fill="#68766f">native-messaging adapter; checks</text>
    <text x="250" y="292" font-size="12" fill="#68766f">the extension origin</text>
    <path d="M460 267H536" stroke="#737f7c" stroke-width="1.5"/><path d="M536 262.5L544 267L536 271.5Z" fill="#737f7c"/>
    <text x="500" y="258" font-size="11.5" fill="#68766f" text-anchor="middle">launches</text>
    <rect x="546" y="236" width="368" height="62" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="562" y="260" font-size="15" font-weight="700">Native host</text>
    <text x="562" y="279" font-size="12" fill="#68766f">installed and registered by the ChatGPT app</text>

    <!-- Row 3: Windows Chrome -->
    <rect x="546" y="326" width="368" height="46" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="562" y="354" font-size="15" font-weight="700">Windows Chrome</text>
    <text x="694" y="354" font-size="12" fill="#68766f">with the extension</text>
    <path d="M730 326V306" stroke="#737f7c" stroke-width="1.5"/><path d="M725.5 306L730 298L734.5 306Z" fill="#737f7c"/>

    <text x="44" y="342" font-size="12" fill="#68766f">Linux registration: register-linux writes a manifest</text>
    <text x="44" y="358" font-size="12" fill="#68766f">in the Chrome user-data root, outside Git.</text>
    <text x="40" y="418" font-size="12" fill="#68766f">doctor checks these files read-only; it does not probe the extension connection.</text>
  </g>
</svg>
