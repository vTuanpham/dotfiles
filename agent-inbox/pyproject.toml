[project]
name = "agent-inbox"
version = "0.1.0"
description = "A private phone inbox for existing root agent sessions"
requires-python = ">=3.11,<3.15"
dependencies = ["websockets==15.0.1", "markdown-it-py==4.0.0", "linkify-it-py==2.2.0", "pillow==13.0.0",
                "claude-agent-sdk==0.2.173", "mcp==2.3.0", "agent-client-protocol==0.12.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent-inbox = "agent_inbox.cli:main"

[tool.setuptools.package-data]
agent_inbox = ["index.html", "*.js", "style.css", "mark.svg", "assets/*"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
