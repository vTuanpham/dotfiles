<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
  <title id="title">How Agent Inbox connects a phone to existing sessions</title>
  <desc id="desc">A paired phone browser reaches Agent Inbox through Tailscale Serve inside the tailnet. Agent Inbox talks to four existing connections: the Codex app-server, the Claude Code CLI history and an opt-in channel, the OpenCode v2 service, and saved sessions of an ACP agent such as Antigravity.</desc>
  <!-- Vendor marks identify products and keep their owners' terms; see src/agent_inbox/assets/NOTICE.md. Messages-square mark: Lucide, ISC License. -->
  <rect width="960" height="372" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="40" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">HOW IT CONNECTS</text>
    <text x="40" y="72" font-family="Georgia, serif" font-size="26">One private door to the sessions you already run</text>

    <!-- Phone -->
    <rect x="48" y="150" width="84" height="140" rx="16" fill="#0b0e13" stroke="#2a3342" stroke-width="2"/>
    <rect x="60" y="166" width="60" height="9" rx="4.5" fill="#232b38"/>
    <rect x="60" y="184" width="44" height="22" rx="8" fill="#1a2a2a"/>
    <rect x="76" y="212" width="44" height="22" rx="8" fill="#1d2431"/>
    <rect x="60" y="262" width="60" height="18" rx="9" fill="#232b38"/>
    <circle cx="108" cy="271" r="6" fill="#7ee0bd"/>
    <text x="90" y="318" font-size="15" font-weight="700" text-anchor="middle">Paired browser</text>
    <text x="90" y="337" font-size="12.5" fill="#68766f" text-anchor="middle">each browser pairs separately</text>

    <path d="M152 220H280" fill="none" stroke="#737f7c" stroke-width="1.5"/>
    <path d="M154 215L146 220L154 225ZM278 215L286 220L278 225Z" fill="#737f7c"/>
    <text x="216" y="200" font-size="13" font-weight="700" fill="#a35e43" text-anchor="middle">Tailscale Serve</text>
    <text x="216" y="216" font-size="12" fill="#68766f" text-anchor="middle" dy="-0">HTTPS in the tailnet</text>
    <text x="216" y="244" font-size="12" fill="#68766f" text-anchor="middle">one-use pairing code</text>

    <!-- Agent Inbox -->
    <rect x="300" y="110" width="240" height="220" rx="16" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <g transform="translate(320 128) scale(1.4)" fill="none" stroke="#23786f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      <path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/>
    </g>
    <text x="364" y="150" font-size="19" font-weight="700">Agent Inbox</text>
    <text x="320" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#68766f">127.0.0.1:8766</text>
    <path d="M320 200H520" stroke="#e3e7e4"/>
    <circle cx="326" cy="224" r="3.5" fill="#23786f"/><text x="340" y="228" font-size="13">Chat, commands, forms, images</text>
    <circle cx="326" cy="250" r="3.5" fill="#23786f"/><text x="340" y="254" font-size="13">A delivery receipt for every send</text>
    <circle cx="326" cy="276" r="3.5" fill="#23786f"/><text x="340" y="280" font-size="13">Root discovery every ten seconds</text>
    <text x="320" y="306" font-size="12" fill="#68766f">Native history is never</text>
    <text x="320" y="321" font-size="12" fill="#68766f">archived or deleted</text>

