<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Agent Inbox session details</title>
  <desc id="desc">A drawn details sheet. Started by shows a chain: a parent Claude session, the Agent Bridge job that launched it, and the current Codex session. Usage limits and session totals follow. Notes explain that relationships come from exact native IDs and that each connection reports only what its native interface exposes.</desc>
