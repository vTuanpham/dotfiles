  <title id="title">Agent Inbox on a phone</title>
  <desc id="desc">Three drawn scenes of the Agent Inbox interface. Chat shows a folded run of steps, an inline image and a live step. The composer shows a slash menu of native commands for a Codex session. A question form with a choice, a free-text answer and two attached images waits for the human in an OpenCode session.</desc>
