<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Shell startup order and ownership</title>
  <desc id="desc">Zsh reads .zshenv, then .zprofile for login shells, then .zshrc for interactive shells. Bash reads .bash_profile, which reads .profile, which reads .bashrc for interactive shells. Login files and rc files read the shared env.sh; rc files also read aliases.sh. env.sh reads .cuda_paths and the private secrets file outside the repository.</desc>
  <rect width="960" height="430" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="40" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">SHELL</text>
    <text x="40" y="72" font-family="Georgia, serif" font-size="26">Which file runs when, and who owns what</text>

    <text x="40" y="136" font-size="13" font-weight="700" fill="#23786f">ZSH</text>
    <rect x="96" y="104" width="186" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="110" y="128" font-size="14" font-weight="700">.zshenv</text>
    <text x="110" y="146" font-size="12" fill="#68766f">every zsh</text>
    <path d="M282 134H298" stroke="#737f7c" stroke-width="1.5"/><path d="M298 129.5L306 134L298 138.5Z" fill="#737f7c"/>
    <rect x="306" y="104" width="140" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="320" y="128" font-size="14" font-weight="700">.zprofile</text>
    <text x="320" y="146" font-size="12" fill="#68766f">login zsh</text>
    <path d="M446 134H478" stroke="#737f7c" stroke-width="1.5"/><path d="M478 129.5L486 134L478 138.5Z" fill="#737f7c"/>
    <rect x="486" y="104" width="140" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="500" y="128" font-size="14" font-weight="700">.zshrc</text>
    <text x="500" y="146" font-size="12" fill="#68766f">interactive zsh</text>
    <path d="M626 134H658" stroke="#737f7c" stroke-width="1.5"/><path d="M658 129.5L666 134L658 138.5Z" fill="#737f7c"/>
    <rect x="666" y="104" width="270" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="680" y="124" font-size="12" fill="#68766f">autocomplete (owns compinit), Starship,</text>
    <text x="680" y="140" font-size="12" fill="#68766f">Ghostty integration; syntax highlighting</text>
    <text x="680" y="156" font-size="12" fill="#68766f">loads after the first prompt</text>

    <rect x="306" y="172" width="64" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="338" y="187" font-size="11.5" fill="#23786f" text-anchor="middle">env.sh</text>
    <rect x="486" y="172" width="64" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="518" y="187" font-size="11.5" fill="#23786f" text-anchor="middle">env.sh</text>
    <rect x="556" y="172" width="82" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="597" y="187" font-size="11.5" fill="#23786f" text-anchor="middle">aliases.sh</text>

    <text x="40" y="252" font-size="13" font-weight="700" fill="#23786f">BASH</text>
    <rect x="96" y="220" width="170" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="110" y="244" font-size="14" font-weight="700">.bash_profile</text>
    <text x="110" y="262" font-size="12" fill="#68766f">login bash; reads .profile</text>
    <path d="M266 250H298" stroke="#737f7c" stroke-width="1.5"/><path d="M298 245.5L306 250L298 254.5Z" fill="#737f7c"/>
    <rect x="306" y="220" width="140" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="320" y="244" font-size="14" font-weight="700">.profile</text>
    <text x="320" y="262" font-size="12" fill="#68766f">login environment</text>
    <path d="M446 250H478" stroke="#737f7c" stroke-width="1.5"/><path d="M478 245.5L486 250L478 254.5Z" fill="#737f7c"/>
    <rect x="486" y="220" width="140" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="500" y="244" font-size="14" font-weight="700">.bashrc</text>
    <text x="500" y="262" font-size="12" fill="#68766f">interactive bash only</text>
    <path d="M626 250H658" stroke="#737f7c" stroke-width="1.5"/><path d="M658 245.5L666 250L658 254.5Z" fill="#737f7c"/>
    <rect x="666" y="220" width="270" height="60" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="680" y="240" font-size="12" fill="#68766f">history, colors, completion; nvm is</text>
    <text x="680" y="256" font-size="12" fill="#68766f">exposed with --no-use so the inherited</text>
    <text x="680" y="272" font-size="12" fill="#68766f">Node stays on PATH</text>

    <rect x="306" y="288" width="64" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="338" y="303" font-size="11.5" fill="#23786f" text-anchor="middle">env.sh</text>
    <rect x="486" y="288" width="64" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="518" y="303" font-size="11.5" fill="#23786f" text-anchor="middle">env.sh</text>
    <rect x="556" y="288" width="82" height="22" rx="11" fill="#e9f2ef" stroke="#23786f"/><text x="597" y="303" font-size="11.5" fill="#23786f" text-anchor="middle">aliases.sh</text>

    <rect x="40" y="338" width="896" height="68" rx="12" fill="#ffffff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="60" y="362" font-size="13" font-weight="700" fill="#23786f">env.sh</text>
    <text x="120" y="362" font-size="12.5" fill="#68766f">shared environment and PATH; reads .cuda_paths, then the private secrets.local.sh when it exists (outside the repository)</text>
    <text x="60" y="388" font-size="13" font-weight="700" fill="#23786f">aliases.sh</text>
    <text x="140" y="388" font-size="12.5" fill="#68766f">shared interactive shortcuts and Ranger's directory-return function</text>
  </g>
</svg>
