[project]
name = "portlink"
version = "0.1.0"
description = "Private preview links with process-owned Tailscale routes"
requires-python = ">=3.11,<3.15"
dependencies = ["segno==1.6.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
portlink = "portlink.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
