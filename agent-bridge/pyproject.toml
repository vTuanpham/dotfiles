[project]
name = "agent-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["codex-wake==0.1.0", "agent-models==0.1.0", "agent-resources==0.1.0",
                "agent-accounts==0.1.0"]

[tool.uv.sources]
codex-wake = { path = "../codex-wake", editable = true }
agent-models = { path = "../agent-models", editable = true }
agent-resources = { path = "../agent-resources", editable = true }
agent-accounts = { path = "../agent-accounts", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[tool.setuptools.package-data]
agent_bridge = ["guide/*.md", "status.schema.json"]

[dependency-groups]
dev = ["pytest", "ruff", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
